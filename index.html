];

function renderWeightList() {
    const container = document.getElementById("weight-list-container");
    if (!container) return;
    container.innerHTML = "";

    myWeightRecords.forEach(record => {
        const heights = WEIGHT_PATTERNS[record.type] || WEIGHT_PATTERNS[1];

        let barsHtml = "";
        const maxHeight = Math.max(...heights, 300); // 基準の高さ

        record.days.forEach((day, index) => {
            const h = heights[index] || 100;
            const heightPercent = Math.min(Math.round((h / maxHeight) * 100), 100);
            
            barsHtml += `
                <div class="weight-bar-col">
                    <div class="weight-bar-wrapper">
                        <div class="weight-bar" style="height: ${heightPercent}%;"></div>
                    </div>
                    <span class="weight-bar-day">${day}</span>
                </div>
            `;
        });

        // 差分の計算（目標まであと何kgか）
        const diff = (record.currentWeight - record.targetWeight).toFixed(1);

        const box = document.createElement("div");
        box.className = "image-display-box weight-box";
        box.innerHTML = `
            <div>
                <div class="ecg-header">
                    <span>アクティブエネルギー</span>
                    <span class="ecg-date">${record.dateRange} ›</span>
                </div>
                <div class="weight-sub-info">
                    <div class="weight-main-val">
                        <span class="weight-num">${record.currentWeight}</span><span class="weight-unit">kg</span>
                        <span class="weight-target">(目標: ${record.targetWeight}kg / 残り ${diff}kg)</span>
                    </div>
                    <div class="weight-cal-info">
                        🔥 平均 ${record.avgCal} kcal/日
                    </div>
                </div>
            </div>
            <div class="weight-graph-container">
                <div class="weight-grid-line"></div>
                <div class="weight-bars-flex">
                    ${barsHtml}
                </div>
            </div>
        `;
        container.appendChild(box);
    });
}

// 実行！
renderWeightList();

// 🌸 睡眠グラフのパターン（1:超人モード[スクショ再現]、2:標準睡眠、3:ショートスリーパー等）
const SLEEP_PATTERNS = {
    1: { // スクショ再現：飛び飛びの極短睡眠
        blocks: [
            { dayIdx: 0, startTop: 50, height: 18, color: "#5e5ce6" }, // 木曜のお昼寝
            { dayIdx: 6, startTop: 65, height: 12, color: "#ac8eef" }  // 水曜の短時間
        ]
    },
    2: { // しっかり睡眠パターン（1日6〜7時間）
        blocks: [
            { dayIdx: 0, startTop: 15, height: 50, color: "#5e5ce6" },
            { dayIdx: 1, startTop: 20, height: 45, color: "#5e5ce6" },
            { dayIdx: 2, startTop: 10, height: 55, color: "#5e5ce6" },
            { dayIdx: 3, startTop: 25, height: 40, color: "#5e5ce6" },
            { dayIdx: 4, startTop: 18, height: 48, color: "#5e5ce6" },
            { dayIdx: 5, startTop: 15, height: 52, color: "#5e5ce6" },
            { dayIdx: 6, startTop: 22, height: 42, color: "#5e5ce6" }
        ]
    }
};

// 🌸🌸🌸 ケンくんの睡眠データ（ここを書き換えて記録！）🌸🌸🌸　🪐現状はβの手打ち測定　いつかウェアラブルと連動させたい🪐
const mySleepRecords = [
    { 
        type: 1, 
        avgHours: "1時間48分", 
        dateRange: "2026年8月20日〜26日",
        scheduleNext: "22:30",
        scheduleWake: "7:00",
        days: ["木", "金", "土", "日", "月", "火", "水"] 
    }
];

// 🌸 睡眠BOXの描画プログラム
function renderSleepList() {
    const container = document.getElementById("sleep-list-container");
    if (!container) return;
    container.innerHTML = "";

    mySleepRecords.forEach(record => {
        const patternData = SLEEP_PATTERNS[record.type] || SLEEP_PATTERNS[1];
        
        // 7日分の列グリッド生成
        let colsHtml = "";
        record.days.forEach((day, index) => {
            // この日に該当するブロックを探す
            const dayBlocks = patternData.blocks.filter(b => b.dayIdx === index);
            let blocksInner = "";

            dayBlocks.forEach(b => {
                blocksInner += `<div class="sleep-block" style="top: ${b.startTop}%; height: ${b.height}%; background: ${b.color};"></div>`;
            });

            colsHtml += `
                <div class="sleep-bar-col">
                    <div class="sleep-bar-wrapper">
                        ${blocksInner}
                    </div>
                    <span class="sleep-bar-day">${day}</span>
                </div>
            `;
        });

        const box = document.createElement("div");
        box.className = "image-display-box sleep-box";
        box.innerHTML = `
            <div>
                <div class="ecg-header">
                    <span>睡眠時間 (平均)</span>
                    <span class="ecg-date">${record.dateRange} ›</span>
                </div>
                <div class="sleep-sub-info">
                    <div class="sleep-main-val">
                        <span class="sleep-num">${record.avgHours}</span>
                        <span class="sleep-note">⚠️ Watch充電中のため昼寝のみ計測</span>
                    </div>
                </div>
            </div>
            <div class="sleep-graph-container">
                <div class="sleep-grid-lines">
                    <span>0:00</span>
                    <span>12:00</span>
                </div>
                <div class="sleep-bars-flex">
                    ${colsHtml}
                </div>
            </div>
        `;
        container.appendChild(box);
    });
}

// 実行！
renderSleepList();
