<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HEALTH CHECK SYSTEM</title>
    <style>
        body {
            background: rgba(0, 5, 15, 0.9);
            color: #e0f7ff;
            font-family: 'Consolas', 'Helvetica Neue', Arial, sans-serif;
            margin: 0;
            padding: 20px;
            overflow-x: hidden;
        }

        /* 🌸 上部固定バナー */
        .system-banner {
            position: fixed;
            top: 0; left: 0; width: 100%;
            height: 40px;
            background: rgba(0, 35, 76, 1);
            display: flex;
            align-items: center;
            padding-left: 20px;
            font-size: 14px;
            letter-spacing: 2px;
            z-index: 100;
            backdrop-filter: blur(5px);
        }

        /* 🌸 セクションタイトル */
        .section-title {
            background: #000;
            color: #00f2fe;
            padding: 8px 15px;
            margin: 25px 0 15px 0;
            font-size: 11px;
            font-weight: bold;
            border-left: 4px solid #00f2fe;
            letter-spacing: 2px;
            box-shadow: inset 0 0 10px rgba(0, 242, 254, 0.2);
        }

        /* コンテンツエリア */
        .container {
            max-width: 950px;
            margin: 0 auto;
            padding-top: 20px; 
            padding-left: 20px;
            padding-right: 20px;
            padding-bottom: 40px;
        }

        .banner-img {
            width: 100%;
            height: auto;
            border-radius: 4px;
        }

        /* カスタムスクロールバー */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: #345485; }

        /* 🌸 控えめでスタイリッシュな画像ディスプレイBOX（心電図用） */
        .image-display-box {
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            width: 380px;
            height: 160px;
            margin: 10px 0;
            padding: 12px;
            background: rgba(10, 15, 25, 0.85);
            border: 1px solid rgba(0, 242, 254, 0.25);
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.08), inset 0 0 10px rgba(0, 0, 0, 0.5);
            transition: all 0.3s ease;
            box-sizing: border-box;
        }

        .image-display-box:hover {
            border-color: rgba(0, 242, 254, 0.5);
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.2), inset 0 0 10px rgba(0, 0, 0, 0.5);
        }

        /* 四隅の近未来風コーナーアクセント */
        .image-display-box::before,
        .image-display-box::after {
            content: '';
            position: absolute;
            width: 8px;
            height: 8px;
            border-color: #00f2fe;
            border-style: solid;
            pointer-events: none;
        }

        .image-display-box::before {
            top: -1px; left: -1px;
            border-width: 2px 0 0 2px;
        }

        .image-display-box::after {
            bottom: -1px; right: -1px;
            border-width: 0 2px 2px 0;
        }

        /* 🌸 心電図（ECG）UIパーツスタイル */
        .ecg-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            font-weight: bold;
            color: #ffffff;
        }

        .ecg-date {
            font-size: 11px;
            color: rgba(220, 235, 255, 0.6);
        }

        .ecg-sub {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            color: #ff4b6e;
            margin-top: 2px;
        }

        .ecg-heart-icon {
            font-size: 10px;
            animation: pulse 1.2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.25); }
            100% { transform: scale(1); }
        }

        /* 🌸 SVG波形グラフ表示エリア */
        .ecg-graph-container {
            width: 100%;
            height: 85px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            position: relative;
            overflow: hidden;
        }

        /* 縦のグリッド線（Apple Watch風） */
        .ecg-grid {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px);
            background-size: 25% 100%;
            pointer-events: none;
        }

        .ecg-svg {
            width: 100%;
            height: 100%;
        }

        .ecg-path {
            fill: none;
            stroke: #ff3b30; /* サイバーレッド（綺麗なネオン赤） */
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            filter: drop-shadow(0 0 3px rgba(255, 59, 48, 0.8));
        }
    </style>
</head>
<body>

</body>
</html>
